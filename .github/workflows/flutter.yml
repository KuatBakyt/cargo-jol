name: Flutter client
on:
  push:
    paths: ['frontend/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/flutter.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: dart format lib test
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter build web --dart-define=API_URL=http://localhost:8000/api
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-client-check
          path: |
            frontend/lib
            frontend/test
            frontend/pubspec.lock
            frontend/build/web
